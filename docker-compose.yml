services:
  frontend:
    image: nginx:latest
    container_name: teleprompter-app
    build: ./frontend
    volumes:
      - ./frontend/nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf
      - ./frontend/build:/usr/share/nginx/html
    ports:
      - "80:80"

  backend:
    container_name: teleprompter-backend
    build: ./backend
    volumes:
      - ./backend/repertoire:/app/repertoire
    ports:
      - "3001:3001"